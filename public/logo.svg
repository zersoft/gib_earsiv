<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arka Plan Gradyanı -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Fatura Kağıdı Gradyanı -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Kıvrım Köşe Gradyanı -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Vurgu / Damga Gradyanı -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Altın / Hilal Yıldız Gradyanı -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Gölge Filtresi -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Kalkan / Dış Rozet Şekli -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- İç İnce Işık Çerçevesi -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Fatura Belgesi (Modern Sayfa) -->
  <g filter="url(#softShadow)">
    <!-- Ana Belge Gövdesi (Sağ üstü kırpık) -->
    <path d="M 148 112 
             L 300 112 
             L 364 176 
             L 364 396 
             A 16 16 0 0 1 348 412 
             L 148 412 
             A 16 16 0 0 1 132 396 
             L 132 128 
             A 16 16 0 0 1 148 112 Z" 
          fill="url(#paperGrad)" />

    <!-- Sağ Üst Köşe Kıvrımı -->
    <path d="M 300 112 
             L 300 164 
             A 12 12 0 0 0 312 176 
             L 364 176 Z" 
          fill="url(#foldGrad)" />
  </g>

  <!-- Belge Satırları (Modern Fatura Çizgileri) -->
  <rect x="168" y="160" width="90" height="12" rx="6" fill="#3B82F6" />
  <rect x="168" y="196" width="176" height="8" rx="4" fill="#94A3B8" />
  <rect x="168" y="218" width="150" height="8" rx="4" fill="#CBD5E1" />
  <rect x="168" y="240" width="168" height="8" rx="4" fill="#CBD5E1" />

  <!-- Ara Çizgi (Tablo Ayırıcı) -->
  <line x1="168" y1="268" x2="344" y2="268" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Alt Tutar Satırları -->
  <rect x="168" y="286" width="70" height="8" rx="4" fill="#94A3B8" />
  <rect x="284" y="286" width="60" height="8" rx="4" fill="#2563EB" />

  <!-- Resmi Onay / e-İmza Yeşil Mührü (Sağ Alt Rozet) -->
  <g filter="url(#softShadow)">
    <circle cx="340" cy="360" r="54" fill="url(#stampGrad)" />
    <circle cx="340" cy="360" r="48" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 3" />
    <!-- Onay / Tik İkonu -->
    <path d="M 320 360 L 334 374 L 362 346" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sol Üst Türk Bayrağı / GİB Hilal Yıldız Minyatür Vurgusu -->
  <g transform="translate(164, 330) scale(0.9)">
    <circle cx="20" cy="20" r="22" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="25" cy="18" r="18" fill="url(#paperGrad)" />
    <!-- Küçük Yıldız -->
    <polygon points="34,14 36,19 41,19 37,22 39,27 34,24 30,27 32,22 28,19 33,19" fill="url(#goldGrad)" />
  </g>
</svg>
